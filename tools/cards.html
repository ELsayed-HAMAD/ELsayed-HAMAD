<!doctype html>
<html>
<head><meta charset="utf-8"><title>card generator</title></head>
<body>
<pre id="out">PENDING</pre>
<script src="logos.js"></script>
<script>
/* ============================================================
   EDIT ONLY THIS BLOCK, then run tools/generate-cards.ps1
   Order here is the order on the strip. Set dark/light to null
   to draw the mark in the theme foreground colour.
   ============================================================ */
const STACK = [
  { slug: "react",       name: "React",        dark: "#61DAFB", light: "#087EA4" },
  { slug: "typescript",  name: "TypeScript",   dark: "#3178C6", light: "#2F6FB8" },
  { slug: "tailwindcss", name: "Tailwind CSS", dark: "#38BDF8", light: "#0E7490" },
  { slug: "nodedotjs",   name: "Node.js",      dark: "#5FA04E", light: "#3C873A" },
  { slug: "fastify",     name: "Fastify",      dark: null,      light: null      },
  { slug: "prisma",      name: "Prisma",       dark: "#8C93F0", light: "#4B55B8" },
  { slug: "postgresql",  name: "PostgreSQL",   dark: "#5B8BF0", light: "#4169E1" },
  { slug: "docker",      name: "Docker",       dark: "#2496ED", light: "#1D7BC4" },
  { slug: "git",         name: "Git",          dark: "#F05032", light: "#D63A1C" },
  { slug: "vercel",      name: "Vercel",       dark: null,      light: null      }
];

const CONTACT = [
  { file: "contact-email",    icon: "mail",     label: "EMAIL",    value: "elsayedhamad67@gmail.com" },
  { file: "contact-linkedin", icon: "linkedin", label: "LINKEDIN", value: "Elsayed Hamad" }
];
/* ============================================================ */

const FONT = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif";
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

const P = {
  dark: {
    tile:"#14161A", tileBorder:"#262B33", fg:"#E6E4E0",
    card:"#14161A", cardBorder:"#262B33", iconBg:"#191D22",
    title:"#F2F4F7", counter:"#6E7781", neutral:"#8B949E"
  },
  light: {
    tile:"#FBFAF8", tileBorder:"#E5E1D9", fg:"#1F1D1A",
    card:"#FBFAF8", cardBorder:"#E5E1D9", iconBg:"#FFFFFF",
    title:"#16150F", counter:"#9A948B", neutral:"#6F6A64"
  }
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function iconMarkup(name, ox, oy, size, color){
  const s = size / 24;
  let body = "";
  if (name === "mail") body =
    '<rect x="2.8" y="5" width="18.4" height="14" rx="2.6"/><path d="M3.6 7 12 13l8.4-6"/>';
  else if (name === "linkedin") body =
    '<rect x="3.4" y="3.4" width="17.2" height="17.2" rx="4.2"/><path d="M7.8 10.6v6.2"/><path d="M7.8 8.1h.01"/><path d="M11.8 16.8v-3.4a2.4 2.4 0 0 1 4.8 0v3.4"/>';

  return '<g transform="translate(' + ox + ',' + oy + ') scale(' + s + ')" fill="none" stroke="' + color +
         '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + body + '</g>';
}

function svgOpen(w, h, label){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
         '" role="img" aria-label="' + esc(label) + '">';
}

/**
 * Draws the stack as brand tiles.
 * The strip is centred inside W, so it stays aligned when the count changes.
 */
function buildLogoStrip(W, cols, tile, gap, mode, pal){
  const rows = Math.ceil(STACK.length / cols);
  const contentW = cols * tile + (cols - 1) * gap;
  const x0 = (W - contentW) / 2;
  const H = rows * tile + (rows - 1) * gap;
  const radius = Math.round(tile * 0.25);
  const label = "Tech stack: " + STACK.map(function(l){ return l.name; }).join(", ") + ".";

  let s = svgOpen(W, H, label);

  STACK.forEach(function(logo, i){
    const d = LOGO_PATHS[logo.slug];
    if (!d || d.indexOf("ERROR:") === 0){ return; }

    const tx = x0 + (i % cols) * (tile + gap);
    const ty = Math.floor(i / cols) * (tile + gap);
    const color = logo[mode] || pal.fg;

    s += '<rect x="' + (tx + 0.5) + '" y="' + (ty + 0.5) + '" width="' + (tile - 1) + '" height="' + (tile - 1) +
         '" rx="' + radius + '" fill="' + pal.tile + '" stroke="' + pal.tileBorder + '"/>';

    const g = tile * 0.5;
    const scale = (g / 24).toFixed(4);
    s += '<g transform="translate(' + (tx + (tile - g) / 2) + ',' + (ty + (tile - g) / 2) + ') scale(' + scale +
         ')" fill="' + color + '"><path d="' + d + '"/></g>';
  });

  return s + '</svg>';
}

const CT = { w: 340, h: 104, pad: 20, iconBox: 42, radius: 13 };

function buildContact(item, pal){
  const label = item.label + ": " + item.value;
  let s = svgOpen(CT.w, CT.h, label);
  s += '<rect x="0.5" y="0.5" width="' + (CT.w - 1) + '" height="' + (CT.h - 1) + '" rx="' + CT.radius +
       '" fill="' + pal.card + '" stroke="' + pal.cardBorder + '"/>';
  s += '<rect x="' + (CT.pad + 0.5) + '" y="' + (31.5) + '" width="' + (CT.iconBox - 1) + '" height="' + (CT.iconBox - 1) +
       '" rx="11" fill="' + pal.iconBg + '" stroke="' + pal.neutral + '" stroke-opacity="0.45"/>';
  s += iconMarkup(item.icon, CT.pad + 9, 40, 24, pal.neutral);
  s += '<text x="78" y="45" font-family="' + MONO + '" font-size="9.5" letter-spacing="1.8" fill="' + pal.counter + '">' +
       esc(item.label) + '</text>';
  s += '<text x="78" y="70" font-family="' + FONT + '" font-size="14" font-weight="600" fill="' + pal.title + '">' +
       esc(item.value) + '</text>';
  s += '<path d="M301 47l5 5-5 5" fill="none" stroke="' + pal.neutral + '" stroke-opacity="0.7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>';
  return s + '</svg>';
}

const files = [];
["dark","light"].forEach(function(t){
  // One strip on desktop, two balanced rows on phones.
  files.push({ name: "logos-" + t + ".svg",        data: buildLogoStrip(860, 10, 64, 14, t, P[t]) });
  files.push({ name: "logos-narrow-" + t + ".svg", data: buildLogoStrip(360, 5, 56, 12, t, P[t]) });
  CONTACT.forEach(function(item){
    files.push({ name: item.file + "-" + t + ".svg", data: buildContact(item, P[t]) });
  });
});

const payload = files.map(function(f){
  return { name: f.name, b64: btoa(unescape(encodeURIComponent(f.data))) };
});
document.getElementById("out").textContent = JSON.stringify(payload);
</script>
</body>
</html>
